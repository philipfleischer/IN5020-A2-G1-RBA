<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">The Message Delivery server: one message at a time, ACK, resend and FAIL</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">The loop in processMessages(), and what happens when a bank stops answering</text><rect x="150" y="180" width="300" height="70" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="300.0" y="212.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Take the next message</text><text x="300.0" y="228.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">messageQueue.take(), waits if empty</text><rect x="150" y="290" width="300" height="70" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="300.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Snapshot of the member list</text><text x="300.0" y="338.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">pendingAcks = every member</text><rect x="150" y="400" width="300" height="70" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="300.0" y="432.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Send to everyone at once</text><text x="300.0" y="448.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">receiveTransaction(id, list)</text><polygon points="300.0,510.0 420.0,570.0 300.0,630.0 180.0,570.0" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/><text x="300.0" y="565.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">All ACKs</text><text x="300.0" y="584.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">within 2 s?</text><rect x="500" y="535" width="260" height="70" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="630.0" y="567.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Resend</text><text x="630.0" y="583.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">to the missing ones (same id)</text><polygon points="630.0,650.0 750.0,710.0 630.0,770.0 510.0,710.0" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/><text x="630.0" y="705.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">All ACKs</text><text x="630.0" y="724.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">within 5 s?</text><rect x="500" y="820" width="260" height="100" rx="8.0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="630.0" y="859.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">FAIL</text><text x="630.0" y="875.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">remove from member list</text><text x="630.0" y="891.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">notifyMembershipChanged()</text><rect x="130" y="950" width="630" height="80" rx="6.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="140.0" y="987.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">leave() (exit) removes the bank from pendingAcks right away</text><text x="140.0" y="1003.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">the server never waits for a bank that has signed off</text><rect x="820" y="120" width="750" height="470" rx="12.0" fill="#ffffff" stroke="#999999" stroke-width="2"/><text x="1195.0" y="145.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Timeline for one message</text><text x="1195.0" y="162.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">A and B answer, C has crashed</text><text x="920.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">0 s</text><text x="1028.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">1 s</text><text x="1136.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">2 s</text><text x="1244.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">3 s</text><text x="1352.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">4 s</text><text x="1460.0" y="555.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">5 s</text><text x="850.0" y="260.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Bank A</text><text x="850.0" y="340.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Bank B</text><text x="850.0" y="420.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Bank C</text><rect x="940" y="232" width="150" height="36" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1015.0" y="254.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">ACK after 0.1 s</text><rect x="960" y="312" width="150" height="36" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1035.0" y="334.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">ACK after 0.3 s</text><rect x="905" y="392" width="30" height="36" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="1066" y="392" width="140" height="36" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="1136.0" y="414.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">resend</text><rect x="1390" y="392" width="140" height="36" rx="6.0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="1460.0" y="414.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">FAIL, removed</text><text x="925.0" y="461.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">sent at 0 s, no ACK</text><rect x="820" y="620" width="750" height="105" rx="8.4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="830.0" y="661.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why wait for every ACK before the next message?</text><text x="830.0" y="678.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Then no replica can be more than one message behind,</text><text x="830.0" y="693.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">and everyone gets the messages in exactly the same order.</text><rect x="820" y="745" width="750" height="105" rx="8.4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="830.0" y="786.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why FAIL?</text><text x="830.0" y="803.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Otherwise a crashed bank would block the whole group forever.</text><text x="830.0" y="818.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">The assignment: tolerate banks disappearing, and keep going.</text><rect x="820" y="870" width="750" height="105" rx="8.4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="830.0" y="911.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Duplicates are harmless</text><text x="830.0" y="928.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">A resend can deliver the same message twice. The bank finds the id</text><text x="830.0" y="943.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">in executedIds, skips the transaction, but still sends the ACK.</text><polyline points="300,250 300,290" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="300.0,290.0 295.4,280.0 304.6,280.0" fill="#1f5fa8"/><polyline points="300,360 300,400" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="300.0,400.0 295.4,390.0 304.6,390.0" fill="#1f5fa8"/><polyline points="300,470 300,510" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="300.0,510.0 295.4,500.0 304.6,500.0" fill="#1f5fa8"/><polyline points="180,570 100,570 100,200 150,200" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round"/><polygon points="150.0,200.0 140.0,204.6 140.0,195.4" fill="#2e7d32"/><polyline points="420,570 500,570" fill="none" stroke="#b85450" stroke-width="2" stroke-linejoin="round"/><polygon points="500.0,570.0 490.0,574.6 490.0,565.4" fill="#b85450"/><polyline points="630,605 630,650" fill="none" stroke="#d79b00" stroke-width="2" stroke-linejoin="round"/><polygon points="630.0,650.0 625.4,640.0 634.6,640.0" fill="#d79b00"/><polyline points="510,710 70,710 70,215 150,215" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round"/><polygon points="150.0,215.0 140.0,219.6 140.0,210.4" fill="#2e7d32"/><polyline points="630,770 630,820" fill="none" stroke="#b85450" stroke-width="2" stroke-linejoin="round"/><polygon points="630.0,820.0 625.4,810.0 634.6,810.0" fill="#b85450"/><polyline points="500,870 40,870 40,230 150,230" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="150.0,230.0 140.0,234.6 140.0,225.4" fill="#666666"/><polyline points="920,520 1500,520" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polygon points="1500.0,520.0 1490.0,524.6 1490.0,515.4" fill="#333333"/><polyline points="920,512 920,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1028,512 1028,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1136,512 1136,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1244,512 1244,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1352,512 1352,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1460,512 1460,528" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><rect x="113.9" y="559.5" width="32.2" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="130.0" y="574.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">yes</text><rect x="447.6" y="559.5" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="460.0" y="574.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle">no</text><rect x="412.7" y="699.5" width="32.2" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="428.8" y="714.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">yes</text><rect x="617.6" y="784.5" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="630.0" y="799.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle">no</text><rect x="232.7" y="859.5" width="98.9" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="282.2" y="874.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">next message</text></svg>