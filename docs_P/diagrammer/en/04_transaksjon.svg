<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330"><rect width="100%" height="100%" fill="#ffffff"/><polyline points="150,145 150,1110" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,6"/><polyline points="450,145 450,1110" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,6"/><polyline points="820,145 820,1110" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,6"/><polyline points="1160,145 1160,1110" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,6"/><polyline points="1450,145 1450,1110" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,6"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">Life of a transaction: "deposit NOK 100" on bank A</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">From the moment the command is typed until all three replicas have executed it</text><rect x="40" y="95" width="220" height="50" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="150.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">User / command file</text><rect x="340" y="95" width="220" height="50" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="450.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Bank server A</text><rect x="710" y="95" width="220" height="50" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="820.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Message Delivery server</text><rect x="1050" y="95" width="220" height="50" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1160.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Bank server B</text><rect x="1340" y="95" width="220" height="50" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1450.0" y="125.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Bank server C</text><rect x="470" y="215" width="330" height="115" rx="9.2" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="480.0" y="245.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">1  Create a Transaction</text><text x="480.0" y="262.5" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="start">command  = "deposit NOK 100"</text><text x="480.0" y="279.7" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="start">uniqueId = "A 0"</text><text x="480.0" y="294.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">add to outstanding_collection</text><text x="480.0" y="309.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">outstanding_counter: 0 → 1</text><rect x="470" y="435" width="330" height="60" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="480.0" y="462.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">2  Waits for the broadcast thread</text><text x="480.0" y="477.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">up to 10 seconds</text><rect x="840" y="560" width="300" height="90" rx="7.2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="850.0" y="595.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">3  Gets message id 7</text><text x="850.0" y="610.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">added to the back of the queue</text><text x="850.0" y="624.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">sent once everyone has ACKed 6</text><rect x="310" y="760" width="280" height="125" rx="10.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="320.0" y="798.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">4  Execute</text><text x="320.0" y="813.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">balance NOK += 100</text><text x="320.0" y="827.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">order_counter++</text><text x="320.0" y="842.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">add to executed_list + executedIds</text><text x="320.0" y="856.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">remove [A 0] from outstanding</text><rect x="1020" y="760" width="280" height="125" rx="10.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1030.0" y="798.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">4  Execute</text><text x="1030.0" y="813.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">balance NOK += 100</text><text x="1030.0" y="827.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">order_counter++</text><text x="1030.0" y="842.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">add to executed_list + executedIds</text><text x="1030.0" y="856.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">(nothing to remove)</text><rect x="1310" y="760" width="280" height="125" rx="10.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1320.0" y="798.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">4  Execute</text><text x="1320.0" y="813.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">balance NOK += 100</text><text x="1320.0" y="827.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">order_counter++</text><text x="1320.0" y="842.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">add to executed_list + executedIds</text><text x="1320.0" y="856.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">(nothing to remove)</text><rect x="840" y="1000" width="300" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="850.0" y="1030.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">5  All 3 ACKs are in</text><text x="850.0" y="1045.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">→ message 8 can be sent</text><text x="850.0" y="1059.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">one missing: resend after 2 s,</text><text x="850.0" y="1074.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">FAIL after 5 s</text><rect x="30" y="1140" width="1540" height="130" rx="10.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="1184.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="start">Result</text><text x="40.0" y="1202.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">All three replicas have executed "A 0" with the same order number, and the balance is the same everywhere.</text><text x="40.0" y="1219.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">Between steps 1 and 4, getQuickBalance shows the old balance. That is why getSyncedBalance exists.</text><text x="40.0" y="1236.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">A sees its own transaction come back just like the others do, and only books it then.</text><polyline points="150,190 450,190" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="450.0,190.0 440.0,194.6 440.0,185.4" fill="#666666"/><polyline points="150,370 450,370" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="450.0,370.0 440.0,374.6 440.0,365.4" fill="#666666"/><polyline points="450,405 150,405" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="8,6" stroke-linejoin="round"/><polygon points="150.0,405.0 160.0,400.4 160.0,409.6" fill="#b85450"/><polyline points="450,535 820,535" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round"/><polygon points="820.0,535.0 810.0,539.6 810.0,530.4" fill="#2e7d32"/><polyline points="820,680 450,680" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="450.0,680.0 460.0,675.4 460.0,684.6" fill="#1f5fa8"/><polyline points="820,700 1160,700" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1160.0,700.0 1150.0,704.6 1150.0,695.4" fill="#1f5fa8"/><polyline points="820,725 1450,725" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1450.0,725.0 1440.0,729.6 1440.0,720.4" fill="#1f5fa8"/><polyline points="450,925 820,925" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,6" stroke-linejoin="round"/><polygon points="820.0,925.0 810.0,929.6 810.0,920.4" fill="#2e7d32"/><polyline points="1160,945 820,945" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,6" stroke-linejoin="round"/><polygon points="820.0,945.0 830.0,940.4 830.0,949.6" fill="#2e7d32"/><polyline points="1450,970 820,970" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,6" stroke-linejoin="round"/><polygon points="820.0,970.0 830.0,965.4 830.0,974.6" fill="#2e7d32"/><rect x="239.4" y="179.6" width="121.1" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="300.0" y="194.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">deposit NOK 100</text><rect x="224.6" y="359.6" width="150.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="300.0" y="374.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">getQuickBalance NOK</text><rect x="209.8" y="394.6" width="180.4" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="300.0" y="409.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle">0.00  (not booked yet!)</text><rect x="472.7" y="525.2" width="324.6" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="635.0" y="539.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">broadcastTransactions([deposit NOK 100 [A 0]])</text><rect x="547.9" y="670.2" width="174.2" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="635.0" y="684.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="middle">receiveTransaction(7, …)</text><rect x="902.9" y="690.2" width="174.2" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="990.0" y="704.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="middle">receiveTransaction(7, …)</text><rect x="1072.2" y="715.2" width="276.8" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1210.6" y="729.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="middle">receiveTransaction(7, …)  (in parallel)</text><rect x="599.2" y="915.2" width="71.6" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="635.0" y="929.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">ack(A, 7)</text><rect x="954.2" y="935.2" width="71.6" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="990.0" y="949.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">ack(B, 7)</text><rect x="1174.8" y="960.2" width="71.6" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1210.6" y="974.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">ack(C, 7)</text></svg>