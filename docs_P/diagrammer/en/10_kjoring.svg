<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">Running the official test scenario: one server and six replicas</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">3 replicas with Rep1 at 0 s, 2 new with Rep2 at 7 s, 1 new with Rep3 at 12 s  (scripts/run_final.sh)</text><rect x="30" y="100" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="131.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Server: Message Delivery server</text><text x="40.0" y="148.1" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="start">java -jar jars/MessageDeliveryServer.jar 1099</text><rect x="560" y="115" width="1000" height="40" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1060.0" y="139.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">runs the whole time</text><rect x="30" y="180" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="211.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 1 (Rep1)</text><text x="40.0" y="228.1" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="start">… group01 3 TradingRate.txt Rep1.txt</text><rect x="560" y="195" width="910" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1015.0" y="219.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep1</text><rect x="30" y="260" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="299.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 2 (Rep1)</text><rect x="560" y="275" width="890" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1005.0" y="299.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep1</text><rect x="30" y="340" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="379.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 3 (Rep1)</text><rect x="560" y="355" width="900" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1010.0" y="379.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep1</text><rect x="30" y="420" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="459.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 4: new (Rep2)</text><rect x="630" y="435" width="870" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="7,5"/><text x="1065.0" y="459.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep2 · late join</text><rect x="30" y="500" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="539.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 5: new (Rep2)</text><rect x="630" y="515" width="890" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="7,5"/><text x="1075.0" y="539.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep2 · late join</text><rect x="30" y="580" width="510" height="70" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="619.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="start">Replica 6: new (Rep3)</text><rect x="680" y="595" width="760" height="40" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="7,5"/><text x="1060.0" y="619.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Rep3 · late join</text><text x="560.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">0 s</text><text x="630.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">7 s</text><text x="680.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">12 s</text><text x="860.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">30 s</text><text x="1010.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">45 s</text><text x="1160.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">60 s</text><text x="1310.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">75 s</text><text x="1460.0" y="715.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">90 s</text><rect x="30" y="740" width="1540" height="170" rx="12.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="787.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">The command for one replica</text><text x="40.0" y="806.1" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">java -Dsync=correct -jar jars/BankServer.jar localhost:1099 group01 3 input/TradingRate.txt input/Rep1.txt &gt; output/correct/rep1_a.txt</text><text x="40.0" y="824.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="40.0" y="841.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Naive version: -Dsync=naive.   Other machines: add -Djava.rmi.server.hostname=&lt;own IP&gt;.</text><text x="40.0" y="856.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">The first three wait for each other (3/3). The replicas started at 7 s and 12 s already see ≥ 3 members, get the state and start right away.</text><text x="40.0" y="872.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Afterwards: every replica that lived to the end must have the same final balance and the same transaction at every order number.</text><polyline points="560,680 1560,680" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polygon points="1560.0,680.0 1550.0,684.6 1550.0,675.4" fill="#333333"/><polyline points="560,672 560,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="630,672 630,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="680,672 680,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="860,672 860,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1010,672 1010,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1160,672 1160,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1310,672 1310,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1460,672 1460,688" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/></svg>