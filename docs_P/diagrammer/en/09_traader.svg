<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">The threads in a bank server, and why they need a lock</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">Four or five threads use the same state at the same time</text><rect x="560" y="300" width="480" height="330" rx="12.0" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="800.0" y="326.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Shared state in BankServer</text><text x="800.0" y="345.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">protected by synchronized (the object's lock)</text><rect x="590" y="390" width="420" height="215" rx="12.0" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/><text x="600.0" y="453.2" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">balances</text><text x="600.0" y="473.1" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">outstandingCollection</text><text x="600.0" y="492.9" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">executedList</text><text x="600.0" y="512.7" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">executedIds</text><text x="600.0" y="532.5" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">orderCounter, outstandingCounter</text><text x="600.0" y="552.2" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="start">pendingSyncResults</text><rect x="40" y="140" width="450" height="150" rx="12.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="50.0" y="196.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Command thread (main)</text><text x="50.0" y="212.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">reads the terminal or the file (0.5–1.5 s per line)</text><text x="50.0" y="228.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">deposit, addInterest: add to outstanding</text><text x="50.0" y="244.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">getHistory, checkTxStatus: read</text><rect x="40" y="500" width="450" height="130" rx="10.4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="50.0" y="554.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Broadcast thread</text><text x="50.0" y="570.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">every 10 s: copy of outstanding_collection</text><text x="50.0" y="586.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">→ broadcastTransactions()</text><rect x="1110" y="140" width="450" height="150" rx="12.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1120.0" y="204.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">RMI thread: receiveTransaction()</text><text x="1120.0" y="220.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">called by the server for every message</text><text x="1120.0" y="236.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">executes, answers own markers, sends ACK</text><rect x="1110" y="500" width="450" height="150" rx="12.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1120.0" y="554.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">RMI threads: membershipChanged(),</text><text x="1120.0" y="573.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">updateState()</text><text x="1120.0" y="589.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">membershipChanged uses its own lock</text><text x="1120.0" y="605.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">(membershipLock) and wakes up startup</text><rect x="560" y="720" width="480" height="100" rx="8.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="7,5"/><text x="800.0" y="759.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Naive getSyncedBalance thread</text><text x="800.0" y="775.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">only with -Dsync=naive</text><text x="800.0" y="791.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">checks every 200 ms if the inbox is empty</text><rect x="40" y="860" width="750" height="120" rx="9.6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="50.0" y="901.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why a lock?</text><text x="50.0" y="917.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Without it, receiveTransaction could remove a transaction from the</text><text x="50.0" y="933.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">inbox while the broadcast thread is copying it: a wrong result or a</text><text x="50.0" y="949.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">ConcurrentModificationException.</text><rect x="810" y="860" width="750" height="120" rx="9.6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="820.0" y="909.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why wait without the lock?</text><text x="820.0" y="925.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">getSyncedBalance waits for its answer without holding the lock.</text><text x="820.0" y="941.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Otherwise receiveTransaction could never deliver the answer: deadlock.</text><polyline points="490,215 560,360" fill="none" stroke="#7b4f9d" stroke-width="2" stroke-linejoin="round"/><polygon points="560.0,360.0 551.5,353.0 559.9,349.0" fill="#7b4f9d"/><polyline points="490,565 560,565" fill="none" stroke="#7b4f9d" stroke-width="2" stroke-linejoin="round"/><polygon points="560.0,565.0 550.0,569.6 550.0,560.4" fill="#7b4f9d"/><polyline points="1110,215 1040,360" fill="none" stroke="#7b4f9d" stroke-width="2" stroke-linejoin="round"/><polygon points="1040.0,360.0 1040.1,349.0 1048.5,353.0" fill="#7b4f9d"/><polyline points="1110,575 1040,575" fill="none" stroke="#7b4f9d" stroke-width="2" stroke-linejoin="round"/><polygon points="1040.0,575.0 1050.0,570.4 1050.0,579.6" fill="#7b4f9d"/><polyline points="800,720 800,650" fill="none" stroke="#7b4f9d" stroke-width="2" stroke-linejoin="round"/><polygon points="800.0,650.0 804.6,660.0 795.4,660.0" fill="#7b4f9d"/><rect x="479.0" y="277.7" width="92.1" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="525.0" y="291.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b4f9d" text-anchor="middle">synchronized</text><rect x="479.0" y="555.2" width="92.1" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="525.0" y="569.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b4f9d" text-anchor="middle">synchronized</text><rect x="1029.0" y="277.7" width="92.1" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1075.0" y="291.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b4f9d" text-anchor="middle">synchronized</text><rect x="1032.4" y="565.2" width="85.2" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1075.0" y="579.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b4f9d" text-anchor="middle">updateState</text><rect x="754.0" y="675.2" width="92.1" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="800.0" y="689.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b4f9d" text-anchor="middle">synchronized</text></svg>