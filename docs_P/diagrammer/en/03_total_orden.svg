<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">Why every replica must execute transactions in the same order</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">Both replicas hold 100 USD. At the same time branch A issues "deposit USD 100" and branch B issues "addInterest USD 10".</text><rect x="30" y="100" width="750" height="640" rx="12.0" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="405.0" y="126.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Without a common order</text><text x="405.0" y="145.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">each replica executes messages in whatever order they happen to arrive</text><rect x="70" y="190" width="280" height="40" rx="6.0" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="210.0" y="215.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Replica 1</text><rect x="110" y="250" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="210.0" y="280.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">100 USD</text><rect x="110" y="390" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="210.0" y="420.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">200 USD</text><rect x="110" y="530" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="210.0" y="560.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">220 USD</text><rect x="430" y="190" width="280" height="40" rx="6.0" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="570.0" y="215.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Replica 2</text><rect x="470" y="250" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="570.0" y="280.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">100 USD</text><rect x="470" y="390" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="570.0" y="420.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">110 USD</text><rect x="470" y="530" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="570.0" y="560.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">210 USD</text><rect x="70" y="620" width="670" height="90" rx="7.2" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="405.0" y="661.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">220 ≠ 210: the replicas disagree on the balance</text><text x="405.0" y="680.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">deposit and interest do not commute, the order changes the result</text><rect x="820" y="100" width="750" height="640" rx="12.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1195.0" y="126.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">With a Message Delivery server</text><text x="1195.0" y="145.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">the server gives each message a sequence number, everyone follows it</text><rect x="985" y="180" width="420" height="90" rx="7.2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1195.0" y="210.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Message Delivery server</text><text x="1195.0" y="230.3" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="middle">#7  deposit USD 100     (A)</text><text x="1195.0" y="250.1" font-family="Menlo, Courier New, monospace" font-size="15" font-weight="normal" fill="#000000" text-anchor="middle">#8  addInterest USD 10  (B)</text><rect x="900" y="330" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1000.0" y="360.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">100 USD</text><rect x="900" y="430" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1000.0" y="460.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">200 USD</text><rect x="900" y="530" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1000.0" y="560.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">220 USD</text><rect x="1260" y="330" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1360.0" y="360.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">100 USD</text><rect x="1260" y="430" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1360.0" y="460.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">200 USD</text><rect x="1260" y="530" width="200" height="50" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1360.0" y="560.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">220 USD</text><rect x="860" y="620" width="670" height="90" rx="7.2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1195.0" y="661.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">220 = 220: every replica is equal</text><text x="1195.0" y="680.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">same start + same operations in the same order = same end state</text><rect x="30" y="770" width="1540" height="100" rx="8.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="799.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="start">This is a replicated state machine.</text><text x="40.0" y="817.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">The account is a state machine: the state is the balances, and every transaction is a transition.</text><text x="40.0" y="834.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">If every replica starts in the same state (0.0) and applies the same transitions in the same order, they end in the same state.</text><text x="40.0" y="851.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">The total order is the only thing the Message Delivery server has to guarantee.</text><polyline points="210,300 210,390" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="210.0,390.0 205.4,380.0 214.6,380.0" fill="#666666"/><polyline points="210,440 210,530" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="210.0,530.0 205.4,520.0 214.6,520.0" fill="#666666"/><polyline points="570,300 570,390" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="570.0,390.0 565.4,380.0 574.6,380.0" fill="#666666"/><polyline points="570,440 570,530" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="570.0,530.0 565.4,520.0 574.6,520.0" fill="#666666"/><polyline points="1000,380 1000,430" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1000.0,430.0 995.4,420.0 1004.6,420.0" fill="#1f5fa8"/><polyline points="1000,480 1000,530" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1000.0,530.0 995.4,520.0 1004.6,520.0" fill="#1f5fa8"/><polyline points="1360,380 1360,430" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1360.0,430.0 1355.4,420.0 1364.6,420.0" fill="#1f5fa8"/><polyline points="1360,480 1360,530" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1360.0,530.0 1355.4,520.0 1364.6,520.0" fill="#1f5fa8"/><polyline points="1100,270 1100,300 1000,300 1000,330" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1000.0,330.0 995.4,320.0 1004.6,320.0" fill="#1f5fa8"/><polyline points="1290,270 1290,300 1360,300 1360,330" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1360.0,330.0 1355.4,320.0 1364.6,320.0" fill="#1f5fa8"/><rect x="149.4" y="326.1" width="121.1" height="37.8" fill="#ffffff" fill-opacity="0.95"/><text x="210.0" y="341.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">deposit USD 100</text><text x="210.0" y="358.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">(from A)</text><rect x="138.3" y="466.1" width="143.4" height="37.8" fill="#ffffff" fill-opacity="0.95"/><text x="210.0" y="481.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">addInterest USD 10</text><text x="210.0" y="498.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">(from B)</text><rect x="498.3" y="326.1" width="143.4" height="37.8" fill="#ffffff" fill-opacity="0.95"/><text x="570.0" y="341.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">addInterest USD 10</text><text x="570.0" y="358.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">(from B)</text><rect x="509.4" y="466.1" width="121.1" height="37.8" fill="#ffffff" fill-opacity="0.95"/><text x="570.0" y="481.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#666666" text-anchor="middle">deposit USD 100</text><text x="570.0" y="498.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">(from A)</text><rect x="987.6" y="394.6" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="1000.0" y="409.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f5fa8" text-anchor="middle">#7</text><rect x="987.6" y="494.6" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="1000.0" y="509.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f5fa8" text-anchor="middle">#8</text><rect x="1347.6" y="394.6" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="1360.0" y="409.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f5fa8" text-anchor="middle">#7</text><rect x="1347.6" y="494.6" width="24.8" height="20.9" fill="#ffffff" fill-opacity="0.95"/><text x="1360.0" y="509.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f5fa8" text-anchor="middle">#8</text></svg>