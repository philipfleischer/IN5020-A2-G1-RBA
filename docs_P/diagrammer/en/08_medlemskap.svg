<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">Membership: startup, new replica, leaving and crashing</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">The server owns the member list. Every change is sent to everyone with membershipChanged()</text><rect x="30" y="100" width="400" height="950" rx="12.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="230.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">A  Startup</text><rect x="55" y="160" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="230.0" y="204.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Bank A: join</text><text x="230.0" y="220.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">members 1/3 → waits</text><rect x="55" y="280" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="230.0" y="324.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Bank B: join</text><text x="230.0" y="340.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">members 2/3 → waits</text><rect x="55" y="400" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="230.0" y="444.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Bank C: join</text><text x="230.0" y="460.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">members 3/3</text><rect x="55" y="520" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="230.0" y="564.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">membershipChanged to all</text><text x="230.0" y="580.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">everyone sees 3 members</text><rect x="55" y="640" width="350" height="95" rx="7.6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="230.0" y="684.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Everyone starts</text><text x="230.0" y="700.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">broadcast thread + commands</text><rect x="55" y="900" width="350" height="130" rx="10.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="65.0" y="946.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why wait?</text><text x="65.0" y="962.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Otherwise A could send a transaction</text><text x="65.0" y="978.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">before C has joined, and C would</text><text x="65.0" y="994.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">miss it forever (C gets no copy).</text><rect x="450" y="100" width="400" height="950" rx="12.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="650.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">B  New replica (late join)</text><rect x="475" y="160" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="650.0" y="212.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Bank D: join</text><rect x="475" y="280" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="650.0" y="315.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Wait until the current message</text><text x="650.0" y="333.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">is ACKed by everyone</text><text x="650.0" y="350.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">no message is half delivered</text><rect x="475" y="400" width="350" height="95" rx="7.6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="650.0" y="436.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Fetch the state from a replica</text><text x="650.0" y="453.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">BankState: balances, executed_list,</text><text x="650.0" y="468.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">order_counter, executedIds</text><rect x="475" y="520" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="650.0" y="564.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">updateState(state) to D</text><text x="650.0" y="580.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">D is now equal to the others</text><rect x="475" y="640" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="650.0" y="684.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D is added to the member list</text><text x="650.0" y="700.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">membershipChanged to all</text><rect x="475" y="760" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="650.0" y="812.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D gets every message from now on</text><rect x="475" y="900" width="350" height="130" rx="10.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="485.0" y="946.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">D already sees ≥ N members</text><text x="485.0" y="962.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">and starts right away.</text><text x="485.0" y="978.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">The state and the messages after</text><text x="485.0" y="994.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">it fit together with no gap.</text><rect x="870" y="100" width="400" height="950" rx="12.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1070.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">C  Leaving (exit)</text><rect x="895" y="160" width="350" height="95" rx="7.6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="1070.0" y="212.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">exit, or end of the file</text><rect x="895" y="280" width="350" height="95" rx="7.6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1070.0" y="324.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Send the rest of the inbox</text><text x="1070.0" y="340.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">the others still execute them</text><rect x="895" y="400" width="350" height="95" rx="7.6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1070.0" y="435.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Wait for unanswered</text><text x="1070.0" y="453.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">getSyncedBalance</text><text x="1070.0" y="470.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">at most 30 s</text><rect x="895" y="520" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1070.0" y="564.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">leave(): removed at once</text><text x="1070.0" y="580.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">the server does not wait for ACK</text><rect x="895" y="640" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1070.0" y="683.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">membershipChanged</text><text x="1070.0" y="701.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">to the others</text><rect x="895" y="760" width="350" height="95" rx="7.6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="1070.0" y="796.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">System.exit(0)</text><text x="1070.0" y="813.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">RMI threads would otherwise</text><text x="1070.0" y="828.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">keep the JVM alive</text><rect x="895" y="900" width="350" height="130" rx="10.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="905.0" y="946.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Leaving is planned</text><text x="905.0" y="962.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">No reason to wait 5 s for</text><text x="905.0" y="978.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">a bank that has said it</text><text x="905.0" y="994.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">is going.</text><rect x="1290" y="100" width="400" height="950" rx="12.0" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1490.0" y="127.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">D  Crash</text><rect x="1315" y="160" width="350" height="95" rx="7.6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="1490.0" y="204.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">The process dies</text><text x="1490.0" y="220.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">kill, Ctrl+C, machine down</text><rect x="1315" y="280" width="350" height="95" rx="7.6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="1490.0" y="332.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">No ACK for the message</text><rect x="1315" y="400" width="350" height="95" rx="7.6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="1490.0" y="452.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">After 2 s: resend</text><rect x="1315" y="520" width="350" height="95" rx="7.6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="1490.0" y="564.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">After 5 s: FAIL</text><text x="1490.0" y="580.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">removed from the member list</text><rect x="1315" y="640" width="350" height="95" rx="7.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1490.0" y="683.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">membershipChanged</text><text x="1490.0" y="701.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">to the rest</text><rect x="1315" y="760" width="350" height="95" rx="7.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1490.0" y="804.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">The rest carry on</text><text x="1490.0" y="820.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">with equal state</text><rect x="1315" y="900" width="350" height="130" rx="10.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="1325.0" y="936.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Crashes are detected, leaves</text><text x="1325.0" y="955.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">are announced</text><text x="1325.0" y="971.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">A crashed process cannot say so</text><text x="1325.0" y="987.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">itself, so the server notices</text><text x="1325.0" y="1003.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">the missing ACK.</text><polyline points="230,255 230,280" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="230.0,280.0 225.4,270.0 234.6,270.0" fill="#666666"/><polyline points="230,375 230,400" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="230.0,400.0 225.4,390.0 234.6,390.0" fill="#666666"/><polyline points="230,495 230,520" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="230.0,520.0 225.4,510.0 234.6,510.0" fill="#666666"/><polyline points="230,615 230,640" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="230.0,640.0 225.4,630.0 234.6,630.0" fill="#666666"/><polyline points="650,255 650,280" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="650.0,280.0 645.4,270.0 654.6,270.0" fill="#666666"/><polyline points="650,375 650,400" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="650.0,400.0 645.4,390.0 654.6,390.0" fill="#666666"/><polyline points="650,495 650,520" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="650.0,520.0 645.4,510.0 654.6,510.0" fill="#666666"/><polyline points="650,615 650,640" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="650.0,640.0 645.4,630.0 654.6,630.0" fill="#666666"/><polyline points="650,735 650,760" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="650.0,760.0 645.4,750.0 654.6,750.0" fill="#666666"/><polyline points="1070,255 1070,280" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1070.0,280.0 1065.4,270.0 1074.6,270.0" fill="#666666"/><polyline points="1070,375 1070,400" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1070.0,400.0 1065.4,390.0 1074.6,390.0" fill="#666666"/><polyline points="1070,495 1070,520" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1070.0,520.0 1065.4,510.0 1074.6,510.0" fill="#666666"/><polyline points="1070,615 1070,640" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1070.0,640.0 1065.4,630.0 1074.6,630.0" fill="#666666"/><polyline points="1070,735 1070,760" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1070.0,760.0 1065.4,750.0 1074.6,750.0" fill="#666666"/><polyline points="1490,255 1490,280" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1490.0,280.0 1485.4,270.0 1494.6,270.0" fill="#666666"/><polyline points="1490,375 1490,400" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1490.0,400.0 1485.4,390.0 1494.6,390.0" fill="#666666"/><polyline points="1490,495 1490,520" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1490.0,520.0 1485.4,510.0 1494.6,510.0" fill="#666666"/><polyline points="1490,615 1490,640" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1490.0,640.0 1485.4,630.0 1494.6,630.0" fill="#666666"/><polyline points="1490,735 1490,760" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1490.0,760.0 1485.4,750.0 1494.6,750.0" fill="#666666"/></svg>