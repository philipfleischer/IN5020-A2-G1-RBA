<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">The data structures in a replica: where a transaction is right now</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">outstanding_collection → (ordered) → executed_list, and two counters that are never reset</text><rect x="30" y="125" width="190" height="90" rx="7.2" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="125.0" y="165.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Command</text><text x="125.0" y="184.1" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="middle">deposit NOK 100</text><rect x="270" y="110" width="260" height="120" rx="9.6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="400.0" y="151.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Outstanding</text><text x="400.0" y="167.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">in outstanding_collection</text><text x="400.0" y="183.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">gets id "A 4"</text><text x="400.0" y="199.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">outstanding_counter: 4 → 5</text><rect x="750" y="125" width="240" height="90" rx="7.2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="870.0" y="159.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Ordered</text><text x="870.0" y="175.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">has a place in the</text><text x="870.0" y="191.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">global order</text><rect x="1100" y="100" width="470" height="140" rx="11.2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1335.0" y="151.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Executed</text><text x="1335.0" y="167.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">balance changed · order_counter++</text><text x="1335.0" y="183.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">added to executed_list and executedIds</text><text x="1335.0" y="199.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">removed from outstanding_collection (on A)</text><rect x="750" y="320" width="240" height="110" rx="8.8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="870.0" y="364.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Skipped</text><text x="870.0" y="380.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">the id is in executedIds</text><text x="870.0" y="396.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">ACK is still sent</text><rect x="1100" y="320" width="470" height="110" rx="8.8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" stroke-dasharray="7,5"/><text x="1335.0" y="364.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Out of the history</text><text x="1335.0" y="380.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">removed from executed_list by cleanHistory</text><text x="1335.0" y="396.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">but still in executedIds → never executed again</text><rect x="30" y="480" width="740" height="370" rx="12.0" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/><text x="40.0" y="504.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Example: getHistory</text><text x="40.0" y="522.6" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">executed_list  = [deposit NOK 100, addInterest NOK 10]</text><text x="40.0" y="541.1" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">outstanding    = [deposit NOK -50, addInterest NOK 5]</text><text x="40.0" y="559.6" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">order_counter  = 5</text><text x="40.0" y="578.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="40.0" y="596.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Output</text><text x="40.0" y="615.0" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">executed_list</text><text x="40.0" y="633.5" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">3. 2026-10-14 10:00:01.123 deposit NOK 100</text><text x="40.0" y="652.0" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">4. 2026-10-14 10:00:11.456 addInterest NOK 10</text><text x="40.0" y="670.5" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">outstanding_collection</text><text x="40.0" y="688.9" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">deposit NOK -50</text><text x="40.0" y="707.4" font-family="Menlo, Courier New, monospace" font-size="14" font-weight="normal" fill="#000000" text-anchor="start">addInterest NOK 5</text><text x="40.0" y="725.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="40.0" y="742.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Executed transactions have a number and the time they were executed.</text><text x="40.0" y="758.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Outstanding ones have no number yet: they only get one once they are ordered.</text><rect x="810" y="480" width="760" height="115" rx="9.2" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="820.0" y="518.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why does the numbering start at 3?</text><text x="820.0" y="535.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">first number = order_counter − executed_list.size() = 5 − 2 = 3</text><text x="820.0" y="550.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">cleanHistory emptied the list after transactions 0–2, but order_counter</text><text x="820.0" y="566.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">is never reset. A transaction has the same number on every replica.</text><rect x="810" y="608" width="760" height="115" rx="9.2" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="820.0" y="646.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">checkTxStatus &lt;id&gt;</text><text x="820.0" y="663.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">EXECUTED: the id is in executedIds</text><text x="820.0" y="678.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">OUTSTANDING: it is in outstanding_collection</text><text x="820.0" y="694.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">UNKNOWN: neither   ·   "checkTxStatus 4" = "&lt;this bank&gt; 4"</text><rect x="810" y="736" width="760" height="114" rx="9.1" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="820.0" y="774.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Two counters that are never reset</text><text x="820.0" y="790.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">outstanding_counter: makes ids, counts only deposit and addInterest</text><text x="820.0" y="806.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">order_counter: number of executed transactions (= next order number)</text><text x="820.0" y="822.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">getSyncedBalance markers get their own ids: "A sync-0", "A sync-1", …</text><polyline points="220,170 270,170" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="270.0,170.0 260.0,174.6 260.0,165.4" fill="#666666"/><polyline points="530,170 750,170" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round"/><polygon points="750.0,170.0 740.0,174.6 740.0,165.4" fill="#2e7d32"/><polyline points="990,170 1100,170" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="1100.0,170.0 1090.0,174.6 1090.0,165.4" fill="#1f5fa8"/><polyline points="870,215 870,320" fill="none" stroke="#b85450" stroke-width="2" stroke-linejoin="round"/><polygon points="870.0,320.0 865.4,310.0 874.6,310.0" fill="#b85450"/><polyline points="1335,240 1335,320" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="1335.0,320.0 1330.4,310.0 1339.6,310.0" fill="#666666"/><rect x="539.2" y="152.4" width="201.5" height="35.2" fill="#ffffff" fill-opacity="0.95"/><text x="640.0" y="166.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">every 10 s</text><text x="640.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#444444" text-anchor="middle">(may be sent more than once)</text><rect x="1005.8" y="160.2" width="78.4" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1045.0" y="174.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="middle">first time</text><rect x="817.1" y="257.7" width="105.8" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="870.0" y="271.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b85450" text-anchor="middle">same id again?</text><rect x="1289.0" y="270.2" width="92.1" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="1335.0" y="284.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">cleanHistory</text></svg>