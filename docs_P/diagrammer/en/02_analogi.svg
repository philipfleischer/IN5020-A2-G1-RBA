<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1246" viewBox="0 0 1500 1246"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">The bank analogy: one account, many branches, one head office</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">Every branch has its own copy of the ledger. They only stay equal because they all book the same slips in the same order.</text><rect x="60" y="100" width="600" height="40" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">In the bank</text><rect x="840" y="100" width="600" height="40" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1140.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">In our system</text><rect x="60" y="160" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="192.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Head office with the ticket machine</text><text x="360.0" y="210.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">gives every slip a running number and sends it out</text><rect x="840" y="160" width="600" height="72" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1140.0" y="192.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Message Delivery server</text><text x="1140.0" y="210.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">puts every message in one global order</text><rect x="60" y="248" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="289.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A branch with its own copy of the ledger</text><rect x="840" y="248" width="600" height="72" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1140.0" y="280.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Bank server (replica)</text><text x="1140.0" y="298.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">balances, executed_list, order_counter</text><rect x="60" y="336" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="377.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">The customer at the counter</text><rect x="840" y="336" width="600" height="72" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="1140.0" y="377.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A command from the terminal or the command file</text><rect x="60" y="424" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="456.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">The inbox on the desk</text><text x="360.0" y="474.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">filled in, but not booked yet</text><rect x="840" y="424" width="600" height="72" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1140.0" y="465.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">outstanding_collection</text><rect x="60" y="512" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="553.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">The courier to head office, every 10 minutes</text><rect x="840" y="512" width="600" height="72" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1140.0" y="544.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">The broadcast thread, every 10 seconds</text><text x="1140.0" y="562.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">broadcastTransactions(list)</text><rect x="60" y="600" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="641.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Booking in the ledger in running-number order</text><rect x="840" y="600" width="600" height="72" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1140.0" y="632.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">receiveTransaction()</text><text x="1140.0" y="650.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">execute · order_counter++ · executed_list</text><rect x="60" y="688" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="729.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A receipt back to head office</text><rect x="840" y="688" width="600" height="72" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1140.0" y="729.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">ack(name, message id)</text><rect x="60" y="776" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="817.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A "booked" stamp on every slip</text><rect x="840" y="776" width="600" height="72" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1140.0" y="808.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">executedIds</text><text x="1140.0" y="826.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">the same transaction is never executed twice</text><rect x="60" y="864" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="905.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A quick look in your own ledger</text><rect x="840" y="864" width="600" height="72" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="1140.0" y="896.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">getQuickBalance</text><text x="1140.0" y="914.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">misses whatever is still in the inbox</text><rect x="60" y="952" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="993.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">"Tell me the balance once everything I handed in is booked"</text><rect x="840" y="952" width="600" height="72" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1140.0" y="984.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">getSyncedBalance</text><text x="1140.0" y="1002.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">marker in the queue (correct) / wait for empty inbox (naive)</text><rect x="60" y="1040" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="1081.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A new branch opens and gets a copy of the ledger</text><rect x="840" y="1040" width="600" height="72" rx="6.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1140.0" y="1081.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Late join: updateState(BankState)</text><rect x="60" y="1128" width="600" height="72" rx="6.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="360.0" y="1169.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">A branch that stops answering is closed</text><rect x="840" y="1128" width="600" height="72" rx="6.0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="1140.0" y="1169.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">No ACK: resend after 2 s, FAIL after 5 s</text><polyline points="660,196 840,196" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,196.0 830.0,200.6 830.0,191.4" fill="#666666"/><polygon points="660.0,196.0 670.0,191.4 670.0,200.6" fill="#666666"/><polyline points="660,284 840,284" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,284.0 830.0,288.6 830.0,279.4" fill="#666666"/><polygon points="660.0,284.0 670.0,279.4 670.0,288.6" fill="#666666"/><polyline points="660,372 840,372" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,372.0 830.0,376.6 830.0,367.4" fill="#666666"/><polygon points="660.0,372.0 670.0,367.4 670.0,376.6" fill="#666666"/><polyline points="660,460 840,460" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,460.0 830.0,464.6 830.0,455.4" fill="#666666"/><polygon points="660.0,460.0 670.0,455.4 670.0,464.6" fill="#666666"/><polyline points="660,548 840,548" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,548.0 830.0,552.6 830.0,543.4" fill="#666666"/><polygon points="660.0,548.0 670.0,543.4 670.0,552.6" fill="#666666"/><polyline points="660,636 840,636" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,636.0 830.0,640.6 830.0,631.4" fill="#666666"/><polygon points="660.0,636.0 670.0,631.4 670.0,640.6" fill="#666666"/><polyline points="660,724 840,724" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,724.0 830.0,728.6 830.0,719.4" fill="#666666"/><polygon points="660.0,724.0 670.0,719.4 670.0,728.6" fill="#666666"/><polyline points="660,812 840,812" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,812.0 830.0,816.6 830.0,807.4" fill="#666666"/><polygon points="660.0,812.0 670.0,807.4 670.0,816.6" fill="#666666"/><polyline points="660,900 840,900" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,900.0 830.0,904.6 830.0,895.4" fill="#666666"/><polygon points="660.0,900.0 670.0,895.4 670.0,904.6" fill="#666666"/><polyline points="660,988 840,988" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,988.0 830.0,992.6 830.0,983.4" fill="#666666"/><polygon points="660.0,988.0 670.0,983.4 670.0,992.6" fill="#666666"/><polyline points="660,1076 840,1076" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,1076.0 830.0,1080.6 830.0,1071.4" fill="#666666"/><polygon points="660.0,1076.0 670.0,1071.4 670.0,1080.6" fill="#666666"/><polyline points="660,1164 840,1164" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="840.0,1164.0 830.0,1168.6 830.0,1159.4" fill="#666666"/><polygon points="660.0,1164.0 670.0,1159.4 670.0,1168.6" fill="#666666"/></svg>