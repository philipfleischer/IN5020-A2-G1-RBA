<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="start">getSyncedBalance: correct (marker in the queue) vs naive (wait for an empty inbox)</text><text x="40.0" y="77.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="start">Same commands on bank A: deposit USD 100 · getSyncedBalance USD · deposit NOK 100  (1 NOK = 0.10 USD)</text><rect x="30" y="100" width="1540" height="400" rx="12.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="800.0" y="126.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Correct (default)</text><text x="800.0" y="145.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">the request is a marker in outstanding_collection and is ordered like a normal transaction</text><rect x="60" y="180" width="230" height="50" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="175.0" y="209.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">1  deposit USD 100</text><rect x="330" y="180" width="270" height="50" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="465.0" y="209.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">2  getSyncedBalance USD</text><rect x="640" y="180" width="230" height="50" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="755.0" y="209.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">3  deposit NOK 100</text><text x="70.0" y="274.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">outstanding_collection at the next broadcast:</text><rect x="60" y="280" width="250" height="55" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="185.0" y="303.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">deposit USD 100</text><text x="185.0" y="320.6" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="middle">A 0</text><rect x="320" y="280" width="290" height="55" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="465.0" y="303.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">getSyncedBalance USD</text><text x="465.0" y="320.6" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="middle">A sync-0   (marker)</text><rect x="620" y="280" width="250" height="55" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="745.0" y="303.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">deposit NOK 100</text><text x="745.0" y="320.6" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="middle">A 1</text><rect x="60" y="385" width="250" height="70" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="185.0" y="417.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">execute</text><text x="185.0" y="433.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">balance: 100 USD</text><rect x="320" y="385" width="290" height="70" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="3"/><text x="465.0" y="415.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">marker: only A answers</text><text x="465.0" y="434.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Synced balance: 100.00</text><rect x="620" y="385" width="250" height="70" rx="6.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="745.0" y="417.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">execute</text><text x="745.0" y="433.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">balance: 110 USD in total</text><rect x="920" y="175" width="620" height="305" rx="12.0" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/><text x="930.0" y="199.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">The answer is the state exactly where the request sits</text><text x="930.0" y="215.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">everything ordered before the marker is included, nothing after</text><text x="930.0" y="233.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="930.0" y="251.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Always done after one broadcast round</text><text x="930.0" y="268.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">≤ 10 s + delivery, no matter how much traffic there is</text><text x="930.0" y="286.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="930.0" y="304.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Other replicas ignore the marker</text><text x="930.0" y="321.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">it is removed from outstanding_collection, but is not</text><text x="930.0" y="337.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">added to executed_list and does not count in order_counter</text><text x="930.0" y="354.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="930.0" y="373.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Does not block the commands</text><text x="930.0" y="389.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">the answer is printed when the marker comes back</text><rect x="30" y="525" width="1540" height="380" rx="12.0" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="800.0" y="551.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Naive  (-Dsync=naive)</text><text x="800.0" y="570.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#444444" text-anchor="middle">answer only once outstanding_collection is empty</text><rect x="60" y="600" width="230" height="50" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="175.0" y="629.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">1  deposit USD 100</text><rect x="330" y="600" width="270" height="50" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="465.0" y="629.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">2  getSyncedBalance USD</text><rect x="640" y="600" width="230" height="50" rx="6.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="755.0" y="629.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">3  deposit NOK 100</text><text x="70.0" y="692.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">outstanding_collection at the next broadcast:</text><rect x="60" y="698" width="250" height="55" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="185.0" y="721.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">deposit USD 100</text><text x="185.0" y="738.6" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="middle">A 0</text><rect x="320" y="698" width="250" height="55" rx="6.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="445.0" y="721.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">deposit NOK 100</text><text x="445.0" y="738.6" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="normal" fill="#000000" text-anchor="middle">A 1</text><rect x="580" y="698" width="290" height="55" rx="6.0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="725.0" y="721.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">own thread checks every 200 ms:</text><text x="725.0" y="738.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">"is the inbox empty?"</text><rect x="60" y="785" width="810" height="90" rx="7.2" fill="#f8cecc" stroke="#b85450" stroke-width="3"/><text x="465.0" y="817.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">The inbox is only empty once both are executed</text><text x="465.0" y="836.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Synced balance: 110.00</text><text x="465.0" y="852.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">includes deposit NOK 100, which was issued AFTER the request</text><rect x="920" y="600" width="620" height="275" rx="12.0" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/><text x="930.0" y="624.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Waits for a moment with an empty inbox</text><text x="930.0" y="640.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">the answer includes transactions issued after the request</text><text x="930.0" y="658.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="930.0" y="676.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Can wait forever</text><text x="930.0" y="693.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">if new transactions keep coming, the inbox is never</text><text x="930.0" y="709.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">empty (starvation, "deadlock" in the assignment text)</text><text x="930.0" y="727.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000" text-anchor="start"></text><text x="930.0" y="745.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Observed with the example file</text><text x="930.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">2nd call: 100.00 (correct) vs 110.00 (naive)</text><text x="930.0" y="777.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">4th call: 120.00 (correct) vs 306.00 (naive)</text><rect x="30" y="930" width="1540" height="80" rx="6.4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="40.0" y="967.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Neither version blocks the command loop.</text><text x="40.0" y="983.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Only then can new transactions arrive while the request is waiting, and the difference becomes visible.</text><polyline points="290,205 330,205" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="330.0,205.0 320.0,209.6 320.0,200.4" fill="#666666"/><polyline points="600,205 640,205" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="640.0,205.0 630.0,209.6 630.0,200.4" fill="#666666"/><polyline points="465,335 465,385" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round"/><polygon points="465.0,385.0 460.4,375.0 469.6,375.0" fill="#1f5fa8"/><polyline points="310,420 320,420" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="320.0,420.0 310.0,424.6 310.0,415.4" fill="#666666"/><polyline points="610,420 620,420" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="620.0,420.0 610.0,424.6 610.0,415.4" fill="#666666"/><polyline points="290,625 330,625" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="330.0,625.0 320.0,629.6 320.0,620.4" fill="#666666"/><polyline points="600,625 640,625" fill="none" stroke="#666666" stroke-width="2" stroke-linejoin="round"/><polygon points="640.0,625.0 630.0,629.6 630.0,620.4" fill="#666666"/><rect x="367.7" y="350.2" width="194.7" height="19.6" fill="#ffffff" fill-opacity="0.95"/><text x="465.0" y="364.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="middle">same order on every replica</text></svg>